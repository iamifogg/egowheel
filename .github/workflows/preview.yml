name: Deploy overhaul preview (/preview/)
# Publishes the overhaul branch at <pages-url>/preview/ while re-publishing the live game from
# `main`, byte-for-byte, at the site root. Nothing on `main` is changed.
# Note: a later push to `main` redeploys the live site without /preview/; re-run this workflow
# (Actions → "Deploy overhaul preview" → Run workflow) to restore the preview.
on:
  push:
    branches: [claude/vibrant-ritchie-bn00ja]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live game (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Checkout overhaul branch
        uses: actions/checkout@v4
        with:
          path: overhaul
      - name: Assemble site
        run: |
          set -e
          # Safety: the preview must use its isolated save/cache namespace.
          grep -q "EW.channel = 'preview'" overhaul/src/channel.js
          grep -q "PREFIX='egowheel-preview-'" overhaul/service-worker.js
          rm -rf site/.git site/.github
          mkdir -p site/preview
          rsync -a --exclude .git --exclude .github --exclude tests --exclude package.json overhaul/ site/preview/
          printf "(function(r){var E=r.EW=r.EW||{};E.build=Object.assign(E.build||{},{version:'v25-preview',commit:'%s',date:'%s'});})(typeof globalThis!=='undefined'?globalThis:this);\n" "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%MZ)" > site/preview/src/build-info.js
          echo "Live root from main: $(git -C overhaul rev-parse --short origin/main 2>/dev/null || echo main)"; ls site site/preview
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
